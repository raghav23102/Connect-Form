# Connect Form — Shopify App Configuration

client_id = "239d4dc6b731b0c50292371bf6920f93"
name = "Connect Form"
application_url = "https://connectform.vercel.app"
embedded = true

[auth]
redirect_urls = [
  "https://connectform.vercel.app/auth/callback",
  "https://connectform.vercel.app/auth/shopify/callback",
  "https://connectform.vercel.app/api/auth/callback"
]

[access_scopes]
scopes = "read_customers,write_customers,read_orders,read_products"

[webhooks]
api_version = "2024-10"

  # App lifecycle
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Scopes updates
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Compliance webhooks (required for App Store)
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["shop/redact"]

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[pos]
embedded = false
